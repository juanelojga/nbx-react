# Netlify configuration for the Next.js App Router build.
# Routing, caching of /_next/static, and API handling are provided by
# @netlify/plugin-nextjs — do not add SPA-style redirects here.
# Security headers are set in next.config.ts (headers()).

[build]
  command = "corepack enable && pnpm run build"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Public build-time values (previously in the committed .env.production).
# Override in the Netlify dashboard if they change.
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://nbx-react.netlify.app"
  NEXT_PUBLIC_API_URL = "https://nbx-django-production.up.railway.app"
  NEXT_PUBLIC_GRAPHQL_ENDPOINT = "https://nbx-django-production.up.railway.app/graphql"
